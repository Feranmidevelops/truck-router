services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: USE_FIXTURES
        value: "false"
      # Rate limits key on the last X-Forwarded-For entry, which Render's proxy appends, so a
      # client cannot fake it. Only raise this after a live request shows more Render hops:
      # a count above the real one lets clients choose their own address again.
      - key: NUM_PROXIES
        value: "1"
