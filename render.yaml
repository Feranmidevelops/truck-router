services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /api/health
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: USE_FIXTURES
        value: "false"
      # Render puts Cloudflare in front of its own proxy and both append to X-Forwarded-For
      # ("<client-sent...>, <client>, <Cloudflare edge>"), so the visitor is 2 from the end.
      # 1 would key every limit on a Cloudflare address shared by strangers.
      - key: NUM_PROXIES
        value: "2"
