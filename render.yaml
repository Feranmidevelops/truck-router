services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /api/health
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: USE_FIXTURES
        value: "false"
      # A live request on Render arrives with X-Forwarded-For "<client-sent...>, <visitor>,
      # <Cloudflare edge>, <Render load balancer>", so the visitor is 3 from the end. 2 would key
      # every limit on a Cloudflare edge address, which changes between requests and is shared.
      - key: NUM_PROXIES
        value: "3"
